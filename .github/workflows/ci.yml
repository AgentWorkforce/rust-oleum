name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-llvm-cov
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Install cargo-llvm-cov
        run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --locked

      - name: Coverage (lcov)
        run: cargo llvm-cov --lcov --output-path lcov.info

      # Cargo only replays diagnostics for crates it rebuilds, so force a
      # rebuild of this crate before capturing the JSON log.
      - name: Clippy JSON log
        run: |
          touch src/main.rs
          cargo clippy --all-targets --message-format=json > clippy-log.json

      - name: Dogfood the gate
        run: >
          cargo run --
          --coverage lcov.info
          --clippy-log clippy-log.json
          --github-summary "$GITHUB_STEP_SUMMARY"
