# rust-oleum configuration — https://github.com/AgentWorkforce/rust-oleum
#
# This is rust-oleum's own gate. Every per-item metric meets its target;
# the only grandfathered debt is the line-coverage floor, which
# `rust-oleum --tighten` raises as coverage climbs toward 100%.

[targets]
cyclomatic_max = 22
cognitive_max = 22
halstead_difficulty_max = 80.0
file_loc_max = 500
coverage_min_pct = 100.0
crap_max = 25.0
surviving_mutants_max = 0
dead_code_max = 0
redundant_code_max = 0
unsafe_max = 0
panic_max = 0
allow_max = 0
file_allow_max = 0

# Opted out of the default BeautifulRust lint groups until CI produces the
# clippy log with their lints enabled; an unenabled lint reads as zero.
[lint_groups]

[sources]
rust_roots = ["src"]

[baseline]
coverage_min_pct = 98.8
