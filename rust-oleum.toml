# rust-oleum configuration — https://github.com/AgentWorkforce/rust-oleum
#
# This is rust-oleum's own gate: the tool meets every target it ships,
# so the baseline is empty.

[targets]
cyclomatic_max = 22
cognitive_max = 22
halstead_difficulty_max = 80.0
file_loc_max = 500
coverage_min_pct = 100.0
crap_max = 25.0
surviving_mutants_max = 0
dead_code_max = 0
redundant_code_max = 0

[sources]
rust_roots = ["src"]

[baseline]
