[package]
name = "rust-oleum"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/AgentWorkforce/rust-oleum"
description = "Stops the rust before it spreads: a code-quality ratchet gate for Rust (and TypeScript) codebases — complexity, coverage, CRAP, mutants, dead code — enforced in CI with a shrinking baseline."
keywords = ["quality", "ci", "complexity", "coverage", "lint"]
categories = ["development-tools", "development-tools::testing"]

[[bin]]
name = "rust-oleum"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Source-level metrics (cyclomatic / cognitive / Halstead) come from a
# syn AST walk; span-locations turns on line/column info in proc-macro2
# fallback spans so per-function line ranges can be joined with lcov data.
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
